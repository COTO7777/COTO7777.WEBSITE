<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私の初めてのWebページ</title>
  <style>
    body {
      font-family: "Yu Gothic", sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #2c3e50;
    }
    p {
      font-size: 18px;
      color: #333;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    a:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>🌸 ようこそ！私のページへ 🌸</h1>
  <p>これはGitHub Pagesで公開した最初のWebページです！</p>
  <p>HTMLを書いて、世界に発信してみよう🌏</p>
  <a href="https://github.com/">GitHubへ戻る</a>
</body>
</html>
