<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>台北駅周辺 避難情報マップ</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }
    header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main {
      display: flex;
      height: calc(100vh - 60px);
    }
    #sidebar {
      width: 30%;
      padding: 10px;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }
    #map {
      width: 70%;
      height: 100%;
    }
    .shelter {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }
    .shelter:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body>
  <header>
    <h1 id="title">台北駅周辺 避難情報マップ</h1>
    <select id="language">
      <option value="ja">日本語</option>
      <option value="zh">繁體中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <div id="sidebar">
      <h2 id="shelterTitle">避難所一覧</h2>
      <div id="shelterList"></div>
    </div>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
