<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Evacuation Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const imageWidth = 3600;
  const imageHeight = 1800;

  const map = L.map('map', {
    crs: L.CRS.Simple
  });

  L.imageOverlay(
    'images/taipei_1f_evacuation.jpg',
    [[0, 0], [imageHeight, imageWidth]]
  ).addTo(map);

  map.fitBounds([[0, 0], [imageHeight, imageWidth]]);
</script>

</body>
</html>
